<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

  <main>
    <figure><figcaption>Approved visual target</figcaption><img src="17-approved-visual-target.png" alt="Approved portfolio visual target"></figure>
